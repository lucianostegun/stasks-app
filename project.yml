name: Stasks
options:
  bundleIdPrefix: com.volkker
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  StasksCore:
    path: StasksCore
targets:
  Stasks:
    type: application
    platform: macOS
    sources:
      - path: Stasks
      - path: hooks/stasks-hook.sh
        buildPhase: resources
      - path: Stasks/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: StasksCore
    info:
      path: Stasks/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDisplayName: Stasks
        CFBundleName: Stasks
        NSAppleEventsUsageDescription: Stasks focuses the terminal tab of a Claude Code session when you click a task.
        NSHumanReadableCopyright: "© 2026 Volkker Tech"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volkker.stasks.app
        PRODUCT_NAME: Stasks
        SWIFT_VERSION: "5"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Stasks/Stasks.entitlements
        DEVELOPMENT_TEAM: MJGJ2M2MK9
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
